<VirtualHost *:80>
    ServerName disaster-training.alertaraqc.com
    DocumentRoot /var/www/html/public

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/disaster-error.log
    CustomLog ${APACHE_LOG_DIR}/disaster-access.log combined
</VirtualHost>
